<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Origin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0f;
    --blue: #3d8bff;
    --text: #f5f5f7;
    --muted: rgba(235, 235, 245, 0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- UI-kaart (glassmorphism) ---------- */
  .card {
    position: fixed; left: 57%; top: 50%;
    width: min(340px, 34vw);
    padding: clamp(18px, 1.8vw, 28px);
    border-radius: 22px;
    background: linear-gradient(145deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    opacity: 0; transform: translateY(-50%);
    pointer-events: none;
  }
  .card-head { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: clamp(15px, 1.25vw, 19px); letter-spacing: -0.01em; }
  .mark {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2.5px solid var(--text);
    box-shadow: 0 0 12px rgba(61,139,255,0.35);
  }
  .nfc { margin-left: auto; font-size: 10px; font-weight: 500; letter-spacing: 0.12em; color: var(--muted); border: 1px solid rgba(255,255,255,0.18); padding: 3px 7px; border-radius: 99px; }
  .verified { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: clamp(14px, 1.15vw, 17px); font-weight: 500; }
  .check {
    display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
    background: var(--blue); color: #fff; font-size: 12px; font-weight: 600;
    box-shadow: 0 0 16px rgba(61,139,255,0.7);
  }
  .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 16px 0 12px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: clamp(12px, 1vw, 14px); color: var(--muted); }
  .meta b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  .row { opacity: 0; }

  /* ---------- Eindbeeld ---------- */
  .end {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    background: radial-gradient(ellipse at 50% 45%, #151826 0%, var(--bg) 60%);
    opacity: 0; pointer-events: none;
  }
  .end h1 { font-size: clamp(56px, 9vw, 150px); font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
  .end p { margin-top: 1.1em; font-size: clamp(16px, 1.7vw, 28px); font-weight: 300; color: var(--muted); letter-spacing: -0.005em; }
</style>

  <div class="divider row"></div>

  <h1>Origin</h1>
  <p>Products that prove themselves.</p>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { gsap } from 'gsap';

/* =====================================================================
   1. RENDERER, SCÈNE, CAMERA
   ===================================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000); // achtergrondkleur + gloed komen uit de laatste pass

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

const BASE_FOV = 30;
const camera = new THREE.PerspectiveCamera(BASE_FOV, 16 / 9, 0.1, 100);

/* =====================================================================
   2. BELICHTING (driepunts + elektrisch blauwe rim)
   ===================================================================== */
const key = new THREE.DirectionalLight(0xfff3e6, 1.9);
key.position.set(3.5, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1; key.shadow.camera.far = 20;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd6deff, 0.7);
fill.position.set(-5, 2.5, 3);
scene.add(fill);

const back = new THREE.DirectionalLight(0xffffff, 1.0);
back.position.set(-2.5, 3.5, -5);
scene.add(back);

const rim = new THREE.DirectionalLight(0x2f7bff, 4.0);
rim.position.set(4.5, 1.6, -4.5);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0xffffff, 0x101018, 0.15));

/* =====================================================================
   3. VLOER: reflectie + zachte schaduw + fade naar het donker
   ===================================================================== */
const floorGeo = new THREE.PlaneGeometry(40, 40);
const reflector = new Reflector(floorGeo, {
  clipBias: 0.003,
  textureWidth: window.innerWidth * 0.35,
  textureHeight: window.innerHeight * 0.35,
  color: 0x1e1e24,
});
reflector.rotation.x = -Math.PI / 2;
// de reflectie-render hoeft de shadow map niet nog eens te berekenen
{
  const orig = reflector.onBeforeRender;
  reflector.onBeforeRender = function (...args) {
    const au = renderer.shadowMap.autoUpdate;
    renderer.shadowMap.autoUpdate = false;
    orig.apply(this, args);
    renderer.shadowMap.autoUpdate = au;
  };
}
scene.add(reflector);

// donkere, radiaal uitlopende laag over de reflectie (dimt en laat de randen wegvallen)
const floorFade = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uColor: { value: new THREE.Color(0x000000) } },
    vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 uColor; varying vec2 vP;
      void main(){ float r = length(vP*vec2(1.0,1.25)); float a = mix(0.7, 1.0, smoothstep(0.6, 5.0, r)); gl_FragColor = vec4(uColor, a); }`,
  })
);
floorFade.rotation.x = -Math.PI / 2;
floorFade.position.y = 0.002;
floorFade.renderOrder = -3;
scene.add(floorFade);

const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.55 }));
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = 0.004;
shadowPlane.receiveShadow = true;
shadowPlane.renderOrder = -2;
scene.add(shadowPlane);

// zachte contactschaduw onder de zwevende schoen
function radialTexture(inner = 'rgba(0,0,0,0.85)') {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, inner); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const blob = new THREE.Mesh(
  new THREE.PlaneGeometry(3.6, 1.5),
  new THREE.MeshBasicMaterial({ map: radialTexture(), transparent: true, depthWrite: false, opacity: 0.8 })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.006;
blob.renderOrder = -1;
scene.add(blob);

/* =====================================================================
   4. MATERIALEN
   ===================================================================== */
function leatherBump() {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 14000; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 0.8 + Math.random() * 2.6;
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)';
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const bump = leatherBump();

const mat = {
  leather: new THREE.MeshPhysicalMaterial({ color: 0xf3f1ec, roughness: 0.62, metalness: 0.02, clearcoat: 0.35, clearcoatRoughness: 0.45, bumpMap: bump, bumpScale: 0.6, side: THREE.DoubleSide }),
  overlay: new THREE.MeshPhysicalMaterial({ color: 0xf7f6f2, roughness: 0.5, metalness: 0.02, clearcoat: 0.5, clearcoatRoughness: 0.35, bumpMap: bump, bumpScale: 0.35, side: THREE.DoubleSide }),
  lining: new THREE.MeshStandardMaterial({ color: 0xe7e3dc, roughness: 0.9, side: THREE.DoubleSide }),
  sole: new THREE.MeshPhysicalMaterial({ color: 0xebe6da, roughness: 0.58, metalness: 0, clearcoat: 0.1 }),
  gum: new THREE.MeshStandardMaterial({ color: 0x7a4a2c, roughness: 0.78 }),
  insole: new THREE.MeshStandardMaterial({ color: 0xd8d3c8, roughness: 0.95 }),
  lace: new THREE.MeshStandardMaterial({ color: 0xf8f8f6, roughness: 0.85 }),
  stitch: new THREE.MeshStandardMaterial({ color: 0xcfc9bd, roughness: 0.9 }),
  eyelet: new THREE.MeshStandardMaterial({ color: 0x2d6a9c, roughness: 0.6 }),
  emblem: new THREE.MeshPhysicalMaterial({ color: 0xd9dbe0, roughness: 0.22, metalness: 0.9, clearcoat: 1 }),
  blue: new THREE.MeshPhysicalMaterial({ color: 0x4a8ec6, roughness: 0.55, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.5, bumpMap: bump, bumpScale: 1.0, side: THREE.DoubleSide }),
  stitchBlue: new THREE.MeshStandardMaterial({ color: 0x3b7cb2, roughness: 0.9 }),
  groove: new THREE.MeshStandardMaterial({ color: 0xbdb7ab, roughness: 0.9 }),
};
// materialen die tijdens het röntgeneffect transparant worden
const xrayFade = [mat.leather, mat.overlay, mat.lining, mat.lace, mat.stitch, mat.eyelet, mat.emblem, mat.blue, mat.stitchBlue];
const insoleFade = [mat.insole];

const xrayMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uColor: { value: new THREE.Color(0x3d8bff) }, uOpacity: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vV;
    void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `uniform vec3 uColor; uniform float uOpacity; varying vec3 vN; varying vec3 vV;
    void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.6);
      gl_FragColor = vec4(uColor * (f * 1.5 + 0.012) * uOpacity, 1.0); }`,
});

/* =====================================================================
   5. PROCEDURELE SNEAKER
   Lengte langs x (hiel = -x, neus = +x), breedte langs z (+z = buitenkant), y omhoog.
   ===================================================================== */
const L = 2.8;
const SOLE_TOP = 0.38;
const BASE = 0.32; // onderrand van de upper (zit verzonken in de cupsole)

function spline(keys) {
  return (u) => {
    if (u <= keys[0][0]) return keys[0][1];
    if (u >= keys[keys.length - 1][0]) return keys[keys.length - 1][1];
    let k = 0; while (u > keys[k + 1][0]) k++;
    const [x0, y0] = keys[k], [x1, y1] = keys[k + 1];
    const m0 = k > 0 ? (y1 - keys[k - 1][1]) / (x1 - keys[k - 1][0]) : (y1 - y0) / (x1 - x0);
    const m1 = k < keys.length - 2 ? (keys[k + 2][1] - y0) / (keys[k + 2][0] - x0) : (y1 - y0) / (x1 - x0);
    const h = x1 - x0, t = (u - x0) / h, t2 = t * t, t3 = t2 * t;
    return (2*t3 - 3*t2 + 1) * y0 + (t3 - 2*t2 + t) * h * m0 + (-2*t3 + 3*t2) * y1 + (t3 - t2) * h * m1;
  };
}
// breedteprofiel (bovenaanzicht): ronde hiel, smalle wreef, brede bal, ronde neus
function widthProfile(u) {
  const n = u < 0.5 ? 5.0 : 3.4; // ronde, volle hiel en neus (geen puntige taper)
  const ends = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(2 * u - 1), n)), 1 / n);
  const s = 0.82 + 0.18 * Math.exp(-(((u - 0.7) / 0.24) ** 2)) - 0.04 * Math.exp(-(((u - 0.42) / 0.12) ** 2));
  return ends * s;
}
const X = (u) => -L / 2 + L * u;
const soleHW = (u) => 0.5 * widthProfile(u);
const upperHW = (u) => soleHW(u) + 0.012;
// zijprofiel: hoge hiel, wreef loopt schuin af naar een hoge, ronde neus
const Hroof = spline([[0, 0.73], [0.12, 0.85], [0.23, 0.88], [0.33, 0.78], [0.5, 0.66], [0.62, 0.59], [0.74, 0.52], [0.8, 0.45], [0.87, 0.4], [1, 0.38]]);
const H = (u) => (u < 0.86 ? Hroof(u) : Hroof(u) * Math.pow(Math.max(0, 1 - ((u - 0.86) / 0.14) ** 2), 0.45));
// kraag-/tongopening: hoek vanaf het midden bovenaan waar het leer stopt
const cutRaw = spline([[0, 0], [0.02, 0.7], [0.08, 1.05], [0.22, 1.05], [0.29, 0.6], [0.34, 0.22], [0.4, 0.14], [0.72, 0.11], [0.78, 0], [1, 0]]);
const thetaCut = (u) => (u > 0.78 ? 0 : Math.max(0, cutRaw(u)));
// doorsnede wordt ronder richting de neus
const crossExp = (u) => THREE.MathUtils.lerp(0.28, 0.5, THREE.MathUtils.smoothstep(u, 0.05, 0.36)) + 0.3 * THREE.MathUtils.smoothstep(u, 0.6, 0.95);

const _v = new THREE.Vector3();
function surfBase(u, th, out = new THREE.Vector3()) {
  const hw = upperHW(u), s = Math.sin(th), c = Math.cos(th);
  return out.set(X(u), BASE + H(u) * Math.pow(Math.abs(c), crossExp(u)), hw * Math.sign(s) * Math.pow(Math.abs(s), 0.7));
}
function surfNormal(u, th, out = new THREE.Vector3()) {
  const e = 1e-3;
  const uu = THREE.MathUtils.clamp(u, 0.004, 0.996);
  const thc = THREE.MathUtils.clamp(th, -Math.PI / 2 + 0.002, Math.PI / 2 - 0.002);
  const a = surfBase(uu + e, thc), b = surfBase(uu - e, thc);
  const c = surfBase(uu, thc + e), d = surfBase(uu, thc - e);
  const du = a.sub(b), dt = c.sub(d);
  out.crossVectors(du, dt).normalize();
  const p = surfBase(uu, thc);
  const ref = p.clone().sub(_v.set(THREE.MathUtils.clamp(p.x, -0.9, 0.9), BASE + 0.12, 0));
  if (out.dot(ref) < 0) out.negate();
  return out;
}
function surf(u, th, off = 0) {
  const p = surfBase(u, th);
  if (off) p.addScaledVector(surfNormal(u, th), off);
  return p;
}

// algemene "patch"-bouwer over een (a,b)-raster → (u,θ) op het oppervlak
function patch(nu, nv, map, off = 0) {
  const pos = [], nor = [], uv = [], idx = [];
  for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {
    const [u, th] = map(i / nu, j / nv);
    const p = surf(u, th, off), n = surfNormal(u, th);
    pos.push(p.x, p.y, p.z); nor.push(n.x, n.y, n.z);
    uv.push(p.x * 1.6, (th / Math.PI) * 2.4 + p.y);
  }
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a = i * (nv + 1) + j, b = a + nv + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  orientWinding(pos, nor, idx);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
function orientWinding(pos, nor, idx) {
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), N = new THREE.Vector3();
  let score = 0;
  for (let t = 0; t < idx.length; t += 3) {
    A.fromArray(pos, idx[t] * 3); B.fromArray(pos, idx[t + 1] * 3); C.fromArray(pos, idx[t + 2] * 3);
    const fn = B.sub(A).cross(C.sub(A));
    N.fromArray(nor, idx[t] * 3);
    score += fn.dot(N);
  }
  if (score < 0) for (let t = 0; t < idx.length; t += 3) { const tmp = idx[t + 1]; idx[t + 1] = idx[t + 2]; idx[t + 2] = tmp; }
}

const shoe = new THREE.Group();      // geheel (hoogte)
const spin = new THREE.Group();      // rotatie rond eigen as
spin.add(shoe);
scene.add(spin);
shoe.position.x = 0; // geometrie is al rond de oorsprong gecentreerd

const xrayMeshes = [];
function add(geo, material, { cast = true, receive = true, xray = false } = {}) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = cast; m.receiveShadow = receive;
  shoe.add(m);
  if (xray) { const x = new THREE.Mesh(geo, xrayMat); x.renderOrder = 10; x.visible = false; shoe.add(x); xrayMeshes.push(x); }
  return m;
}

// ---------- Zool ----------
function soleShape(scale = 1, inset = 0) {
  const pts = [], N = 90;
  for (let k = 0; k <= N; k++) { const u = (1 - Math.cos(Math.PI * k / N)) / 2; pts.push(new THREE.Vector2(X(u) * scale, -(soleHW(u) * scale - inset))); }
  for (let k = N - 1; k > 0; k--) { const u = (1 - Math.cos(Math.PI * k / N)) / 2; pts.push(new THREE.Vector2(X(u) * scale, (soleHW(u) * scale - inset))); }
  return new THREE.Shape(pts);
}
function extrudeUp(shape, depth, bevel, y0) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 8, steps: 1 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, y0 + bevel, 0);
  g.computeVertexNormals();
  return g;
}
const outsole = add(extrudeUp(soleShape(1, -0.028), 0.006, 0.007, 0), mat.gum); // dunne gum-onderkant
const cupsole = add(extrudeUp(soleShape(), 0.29, 0.035, 0.02), mat.sole);

// stiksel rond de cupsole
function soleOutline(offset, y) {
  const s = soleShape(); const pts = s.getPoints(1);
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p0 = pts[(i - 1 + pts.length) % pts.length], p1 = pts[(i + 1) % pts.length], p = pts[i];
    const t = new THREE.Vector2().subVectors(p1, p0).normalize();
    const n = new THREE.Vector2(t.y, -t.x);
    out.push(new THREE.Vector3(p.x + n.x * offset, y, -(p.y + n.y * offset)));
  }
  // zorg dat de normaal naar buiten wijst
  if (out[Math.floor(out.length / 4)].z * pts[Math.floor(pts.length / 4)].y > 0) {
    return pts.map((p, i) => {
      const p0 = pts[(i - 1 + pts.length) % pts.length], p1 = pts[(i + 1) % pts.length];
      const t = new THREE.Vector2().subVectors(p1, p0).normalize();
      return new THREE.Vector3(p.x - t.y * offset, y, -(p.y + t.x * offset));
    });
  }
  return out;
}

// ---------- Inlegzool ----------
const insoleGeo = new THREE.ShapeGeometry(soleShape(0.93, 0.05), 6);
insoleGeo.rotateX(-Math.PI / 2);
insoleGeo.translate(0, SOLE_TOP + 0.016, 0);
const insole = add(insoleGeo, mat.insole, { cast: false });

// ---------- Upper (twee helften, open kraag en tongopening) ----------
for (const side of [-1, 1]) {
  add(patch(140, 40, (a, b) => [a, side * THREE.MathUtils.lerp(Math.PI / 2, thetaCut(a), b)]), mat.leather, { xray: true });
}

// ---------- Mudguard (blauwe band rondom, loopt op over de neus) ----------
const bandTop = spline([[0, 1.5], [0.35, 1.535], [0.55, 1.5], [0.68, 1.38], [0.8, 1.15], [0.92, 0.92], [1, 0.72]]);
const mudMap = (side) => (a, b) => { const u = THREE.MathUtils.lerp(0.02, 0.999, a); return [u, side * THREE.MathUtils.lerp(Math.PI / 2, bandTop(u), b)]; };
for (const side of [-1, 1]) add(patch(100, 14, mudMap(side), 0.005), mat.blue, { xray: true });

// ---------- Eyestay (breed blauw paneel dat vooraan doorloopt tot de mudguard) ----------
const eyeW = spline([[0.3, 0.5], [0.55, 0.55], [0.7, 0.7], [0.76, 0.95], [0.8, 1.2]]);
const EYE_END = 0.8;
const eyeMap = (side) => (a, b) => { const u = THREE.MathUtils.lerp(0.3, EYE_END, a); return [u, side * Math.min(Math.PI / 2, thetaCut(u) + eyeW(u) * (1 - b))]; };
for (const side of [-1, 1]) add(patch(60, 12, eyeMap(side), 0.008), mat.blue, { xray: true });

// ---------- Hielstuk (groot blauw hielpaneel) ----------
const heelEnd = (b) => 0.33 - 0.11 * b;
const heelMap = (side) => (a, b) => {
  const u = Math.max(0.001, a * heelEnd(b));
  const top = Math.min(Math.PI / 2, thetaCut(u) + 0.1);
  return [u, side * THREE.MathUtils.lerp(Math.PI / 2, top, b)];
};
for (const side of [-1, 1]) add(patch(40, 24, heelMap(side), 0.011), mat.blue, { xray: true });

// ---------- Perforaties op de witte neus ----------
{
  const spots = [];
  for (let r = 0; r < 5; r++) {
    const u = EYE_END + 0.025 + r * 0.028;
    for (let k = -6; k <= 6; k++) {
      const th = (k + (r % 2) * 0.5) * 0.12;
      if (Math.abs(th) < bandTop(u) - 0.12) spots.push([u, th]);
    }
  }
  const im = new THREE.InstancedMesh(new THREE.CircleGeometry(0.0075, 10), new THREE.MeshStandardMaterial({ color: 0x7c7972, roughness: 1 }), spots.length);
  xrayFade.push(im.material);
  const o = new THREE.Object3D();
  spots.forEach(([u, th], i) => { const p = surf(u, th, 0.0025); o.position.copy(p); o.lookAt(p.clone().add(surfNormal(u, th))); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
  shoe.add(im);
}

// ---------- Kraag-rand (gewatteerde rand langs de opening) ----------
{
  const pts = [];
  for (let k = 0; k <= 60; k++) { const u = 0.78 * (1 - k / 60); pts.push(surf(u, -thetaCut(u), -0.012)); }
  for (let k = 1; k <= 60; k++) { const u = 0.78 * (k / 60); pts.push(surf(u, thetaCut(u), -0.012)); }
  const curve = new THREE.CatmullRomCurve3(pts);
  add(new THREE.TubeGeometry(curve, 260, 0.034, 10, false), mat.blue, { xray: true });
}

// ---------- Tong (kort en gewatteerd, net boven de kraag) ----------
{
  const tongue = (s, t) => {
    const u = THREE.MathUtils.lerp(0.79, 0.26, s);
    const w = 0.16 + 0.05 * s;
    const lift = s > 0.72 ? Math.pow((s - 0.72) / 0.28, 2) * 0.09 : 0;
    const y = BASE + Hroof(u) + 0.014 + lift - 0.08 * t * t;
    const x = X(u) - lift * 0.5;
    return new THREE.Vector3(x, y, t * w);
  };
  const nu = 50, nv = 20, pos = [], uv = [], idx = [];
  for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {
    const p = tongue(i / nu, j / nv * 2 - 1); pos.push(p.x, p.y, p.z); uv.push(p.x * 1.6, p.z * 1.6);
  }
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) { const a = i * (nv + 1) + j, b = a + nv + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  add(g, mat.leather, { xray: true });
  // rand van de tong
  const edge = [];
  for (let j = 0; j <= 30; j++) edge.push(tongue(1, j / 30 * 2 - 1));
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(edge), 40, 0.028, 10, false), mat.overlay);
}

// ---------- Stiksels (instanced) ----------
const stitchGeo = new THREE.BoxGeometry(1, 1, 1);
function stitches(points, { dash = 0.022, gap = 0.014, thick = 0.0055, material = mat.stitchBlue } = {}) {
  const curve = new THREE.CatmullRomCurve3(points);
  const len = curve.getLength();
  const n = Math.floor(len / (dash + gap));
  const im = new THREE.InstancedMesh(stitchGeo, material, n);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(dash, thick, thick);
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    q.setFromUnitVectors(new THREE.Vector3(1, 0, 0), tan);
    m.compose(p, q, sc); im.setMatrixAt(i, m);
  }
  im.castShadow = false; im.receiveShadow = true;
  shoe.add(im);
  return im;
}
const range = (n, f) => Array.from({ length: n + 1 }, (_, k) => f(k / n));
// mudguard-bovenrand (binnenkant → neus → buitenkant)
stitches([
  ...range(50, (t) => { const u = THREE.MathUtils.lerp(0.3, 0.995, t); return surf(u, -(bandTop(u) + 0.045), 0.009); }),
  ...range(50, (t) => { const u = THREE.MathUtils.lerp(0.995, 0.3, t); return surf(u, bandTop(u) + 0.045, 0.009); }).slice(1),
]);
// eyestay-rand (binnenkant → voorkant → buitenkant)
{
  const mi = eyeMap(-1), mo = eyeMap(1);
  stitches([
    ...range(30, (t) => { const [u, th] = mi(t * 0.985, 0.08); return surf(u, th, 0.013); }),
    ...range(16, (t) => { const th = THREE.MathUtils.lerp(-1, 1, t) * Math.min(Math.PI / 2, eyeW(EYE_END) - 0.05); return surf(EYE_END - 0.012, th, 0.013); }).slice(1, -1),
    ...range(30, (t) => { const [u, th] = mo((1 - t) * 0.985, 0.08); return surf(u, th, 0.013); }),
  ]);
}
// hielstuk (rondom)
{
  const pts = [];
  const mi = heelMap(-1), mo = heelMap(1);
  for (const t of range(16, (t) => t)) { const [u, th] = mi(0.94, 0.04 + t * 0.86); pts.push(surf(u, th, 0.016)); }
  for (const t of range(16, (t) => t)) { const [u, th] = mi(0.94 * (1 - t) + 0.001, 0.9); pts.push(surf(u, th, 0.016)); }
  for (const t of range(16, (t) => t).slice(1)) { const [u, th] = mo(0.94 * t + 0.001, 0.9); pts.push(surf(u, th, 0.016)); }
  for (const t of range(16, (t) => t).slice(1)) { const [u, th] = mo(0.94, 0.9 - t * 0.86); pts.push(surf(u, th, 0.016)); }
  stitches(pts);
}
// zool: stiksel, groef en verticale ribbels onderaan
stitches(soleOutline(0.039, 0.29), { dash: 0.026, gap: 0.016, thick: 0.007, material: mat.stitch });
add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(soleOutline(0.033, 0.2), true), 400, 0.0065, 6, true), mat.groove, { cast: false });
{
  const ring = new THREE.CatmullRomCurve3(soleOutline(0.036, 0.09), true);
  const n = Math.floor(ring.getLength() / 0.034);
  const ribs = new THREE.InstancedMesh(new THREE.BoxGeometry(0.014, 0.11, 0.016), mat.sole, n);
  const o = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    const t = i / n, p = ring.getPointAt(t), tan = ring.getTangentAt(t);
    o.position.copy(p); o.rotation.set(0, Math.atan2(-tan.z, tan.x), 0); o.updateMatrix();
    ribs.setMatrixAt(i, o.matrix);
  }
  ribs.receiveShadow = true;
  shoe.add(ribs);
}

// ---------- Veteroogjes (6 paar) + veters ----------
const eyelets = { in: [], out: [] };
{
  const torus = new THREE.TorusGeometry(0.022, 0.0075, 10, 24);
  for (let i = 0; i < 6; i++) {
    const u = THREE.MathUtils.lerp(0.725, 0.35, i / 5); // van de neus naar de kraag
    for (const side of [-1, 1]) {
      const th = side * (thetaCut(u) + 0.13);
      const p = surf(u, th, 0.01), n = surfNormal(u, th);
      const m = new THREE.Mesh(torus, mat.eyelet);
      m.position.copy(p); m.lookAt(p.clone().add(n));
      m.castShadow = true;
      shoe.add(m);
      (side < 0 ? eyelets.in : eyelets.out).push({ p, n, u });
    }
  }
  // platte, brede veter: buis met een afgeplatte (elliptische) doorsnede
  function ribbon(points, w = 0.052, h = 0.009, seg = 36, rad = 12) {
    const curve = new THREE.CatmullRomCurve3(points);
    const pos = [], idx = [], up = new THREE.Vector3(0, 1, 0), N = new THREE.Vector3(), B = new THREE.Vector3();
    for (let i = 0; i <= seg; i++) {
      const t = i / seg, p = curve.getPointAt(t), T = curve.getTangentAt(t);
      N.copy(up).addScaledVector(T, -up.dot(T)).normalize();
      B.crossVectors(T, N);
      for (let j = 0; j < rad; j++) {
        const a = (j / rad) * Math.PI * 2;
        pos.push(p.x + B.x * Math.cos(a) * w + N.x * Math.sin(a) * h, p.y + B.y * Math.cos(a) * w + N.y * Math.sin(a) * h, p.z + B.z * Math.cos(a) * w + N.z * Math.sin(a) * h);
      }
    }
    for (let i = 0; i < seg; i++) for (let j = 0; j < rad; j++) {
      const a = i * rad + j, b = i * rad + ((j + 1) % rad), c = a + rad, d = b + rad;
      idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  }
  const laceGeos = [];
  const lifted = (e) => e.p.clone().addScaledVector(e.n, 0.004);
  const arch = (a, b, k) => {
    const m = a.p.clone().lerp(b.p, k);
    const u = THREE.MathUtils.lerp(a.u, b.u, k);
    m.y = Math.max(m.y, BASE + Hroof(u) + 0.045 + 0.015 * Math.sin(Math.PI * k));
    return m;
  };
  // strakke "bar lacing": brede banden dwars over de tong, licht schuin
  for (let i = 0; i < 6; i++) {
    const a = eyelets.in[i], b = eyelets.out[Math.min(5, i + (i < 5 ? 0 : 0))];
    const bb = i < 5 ? { ...b, p: b.p.clone().lerp(eyelets.out[i + 1].p, 0.25) } : b;
    laceGeos.push(ribbon([lifted(a), arch(a, bb, 0.2), arch(a, bb, 0.5), arch(a, bb, 0.8), bb.p.clone().addScaledVector(b.n, 0.004)]));
  }
  add(mergeGeometries(laceGeos), mat.lace); // één draw call voor alle veters
}

// ---------- "O"-embleem van Origin op de hiel (buitenkant) ----------
{
  const u = 0.08, th = 1.28;
  const p = surf(u, th, 0.022), n = surfNormal(u, th);
  const o = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.0105, 16, 48), mat.emblem);
  o.position.copy(p); o.lookAt(p.clone().add(n)); o.scale.z = 0.55;
  o.castShadow = true;
  shoe.add(o);
}

/* =====================================================================
   6. NFC-CHIP in de hiel, onder de inlegzool
   ===================================================================== */
const chip = new THREE.Group();
chip.position.set(X(0.17), SOLE_TOP + 0.006, 0);
shoe.add(chip);
const chipMat = {
  board: new THREE.MeshStandardMaterial({ color: 0x14171d, roughness: 0.45, metalness: 0.3 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xc8793a, roughness: 0.32, metalness: 1, emissive: 0xff7a2a, emissiveIntensity: 0 }),
  core: new THREE.MeshBasicMaterial({ color: 0x3d8bff }),
};
chip.add(new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.006, 0.26), chipMat.board));
{
  // vierkante spiraal (spoel-antenne)
  const path = new THREE.CurvePath();
  let r = 0.112; const dr = 0.016; let prev = new THREE.Vector3(-r, 0.005, -r);
  for (let turn = 0; turn < 4; turn++) {
    const c = [new THREE.Vector3(r, 0.005, -r), new THREE.Vector3(r, 0.005, r), new THREE.Vector3(-r, 0.005, r), new THREE.Vector3(-r, 0.005, -r + dr)];
    for (const p of c) { path.add(new THREE.LineCurve3(prev, p)); prev = p; }
    r -= dr;
    const p = new THREE.Vector3(-r, 0.005, -r); path.add(new THREE.LineCurve3(prev, p)); prev = p;
  }
  chip.add(new THREE.Mesh(new THREE.TubeGeometry(path, 600, 0.0032, 6, false), chipMat.copper));
}
const core = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.012, 0.075), chipMat.core);
core.position.y = 0.006;
chip.add(core);
const chipLight = new THREE.PointLight(0x3d8bff, 0, 1.4, 1.6);
chipLight.position.y = 0.08;
chip.add(chipLight);
const halo = new THREE.Mesh(
  new THREE.PlaneGeometry(0.7, 0.7),
  new THREE.MeshBasicMaterial({ map: radialTexture('rgba(90,160,255,1)'), color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.014;
halo.renderOrder = 11;
chip.add(halo);
chip.visible = false;

// 3 cirkelvormige golven
const waves = [];
for (let i = 0; i < 3; i++) {
  const w = new THREE.Mesh(
    new THREE.RingGeometry(0.988, 1.0, 160),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0x3d8bff).multiplyScalar(1.6), transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
  );
  w.rotation.x = -Math.PI / 2;

/* =====================================================================
   7. POSTPROCESSING: bloom → tone mapping → studiogloed/vignet
   ===================================================================== */
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.45, 1.6);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uAspect: { value: 16 / 9 }, uGlow: { value: 0 }, uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uAspect, uGlow, uTime; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec2 p = vUv - vec2(0.5, 0.56); p.x *= uAspect;
      float g = exp(-dot(p,p) * 2.4);
      float l = dot(c.rgb, vec3(0.299,0.587,0.114));
      float dark = 1.0 - smoothstep(0.0, 0.35, l);
      vec3 bg = vec3(10.0, 10.0, 15.0) / 255.0;
      vec3 glow = vec3(0.075, 0.085, 0.13) * g * uGlow;
      c.rgb += (bg + glow) * dark;
      float v = smoothstep(1.25, 0.3, length((vUv - 0.5) * vec2(uAspect, 1.0)));
      c.rgb *= mix(0.7, 1.0, v);
      c.rgb += (rnd(vUv) - 0.5) / 255.0;
      gl_FragColor = c;
    }`,
});
composer.addPass(finalPass);

/* =====================================================================
   8. RESIZE (16:9-compositie, horizontale kadrering blijft behouden)
   ===================================================================== */
function resize() {
  const w = window.innerWidth, h = window.innerHeight, aspect = w / h, pr = renderer.getPixelRatio();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(Math.round(w * pr * 0.5), Math.round(h * pr * 0.5));
  camera.aspect = aspect;
  const target = 16 / 9;
  camera.fov = aspect >= target ? BASE_FOV : THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_FOV / 2)) * target / aspect));
  camera.updateProjectionMatrix();
  finalPass.uniforms.uAspect.value = aspect;
  reflector.getRenderTarget().setSize(Math.round(w * 0.35), Math.round(h * 0.35));
}
window.addEventListener('resize', resize);
resize();

/* =====================================================================
   9. TIJDLIJN (GSAP)
   ===================================================================== */
const S = { exposure: 0, y: 0.04, rot: 0, xray: 0, chip: 0 };
const cam = { px: 0, py: 1.5, pz: 8.8, tx: 0, ty: 0.55, tz: 0 };
const card = document.getElementById('card');
const rows = card.querySelectorAll('.row');
const end = document.getElementById('end');

function buildTimeline() {
  const tl = gsap.timeline({ paused: true });
  // 0–2s: uit het donker omhoog + dolly in
  tl.fromTo(S, { exposure: 0 }, { exposure: 1, duration: 2.2, ease: 'power2.out' }, 0);
  tl.fromTo(S, { y: 0.04 }, { y: 0.24, duration: 2.4, ease: 'power3.out' }, 0);
  tl.fromTo(cam, { px: 0, py: 1.55, pz: 8.8, tx: 0, ty: 0.55, tz: 0 }, { py: 1.35, pz: 6.6, duration: 2.4, ease: 'power2.out' }, 0);
  // 2–6s: 360° draai, eindigt in 3/4-aanzicht
  tl.fromTo(S, { rot: 0 }, { rot: Math.PI * 2 + 0.62, duration: 4.4, ease: 'power2.inOut' }, 2);
  tl.to(cam, { pz: 6.0, duration: 3.6, ease: 'sine.inOut' }, 2.4);
  // 6–8s: hoger 3/4-standpunt + röntgen
  tl.to(cam, { px: 0.5, py: 2.15, pz: 5.4, tx: -0.25, ty: 0.5, tz: 0.1, duration: 2.2, ease: 'power2.inOut' }, 5.9);
  tl.fromTo(S, { xray: 0 }, { xray: 1, duration: 1.5, ease: 'power2.inOut' }, 6.4);
  // 8–10s: chip licht op + golven, camera iets dichter bij de hiel
  tl.fromTo(S, { chip: 0 }, { chip: 1, duration: 0.9, ease: 'power2.out' }, 8.0);
  tl.to(cam, { px: -0.1, py: 1.9, pz: 4.1, tx: -0.55, ty: 0.48, tz: 0.35, duration: 2.0, ease: 'power2.inOut' }, 7.9);
  waves.forEach((w, i) => {
    tl.fromTo(w.scale, { x: 0.1, y: 0.1, z: 0.1 }, { x: 1.25, y: 1.25, z: 1.25, duration: 1.5, ease: 'power1.out' }, 8.45 + i * 0.45);
    tl.fromTo(w.material, { opacity: 0.75 }, { opacity: 0, duration: 1.5, ease: 'power1.in' }, 8.45 + i * 0.45);
  });
  // 10–12s: schoen schuift naar links, UI-kaart schuift in
  tl.to(cam, { px: 0.55, py: 1.85, pz: 5.9, tx: 0.42, ty: 0.55, tz: 0.15, duration: 1.4, ease: 'power2.inOut' }, 9.7);
  tl.fromTo(card, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.9, ease: 'power3.out' }, 10.0);
  tl.fromTo(rows, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: 'power2.out' }, 10.2);
  // eindbeeld
  tl.to(card, { opacity: 0, duration: 0.6, ease: 'power2.in' }, 11.5);
  tl.to(S, { exposure: 0, duration: 0.8, ease: 'power2.in' }, 11.5);
  tl.fromTo(end, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: 'power2.inOut' }, 11.9);
  tl.fromTo(end.children, { opacity: 0, y: 14, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.0, stagger: 0.25, ease: 'power3.out' }, 12.1);
  return tl;
}
const tl = buildTimeline();

/* =====================================================================
   10. RENDER LOOP
   ===================================================================== */
let xrayOn = false;
function setXray(on) {
  xrayOn = on;
  for (const m of [...xrayFade, ...insoleFade]) { m.transparent = on; m.depthWrite = !on; m.needsUpdate = true; }
  for (const x of xrayMeshes) x.visible = on;
}
const VIEW = new URLSearchParams(location.search).get('view');
const tmp = new THREE.Color();
const coreBase = new THREE.Color(0x3d8bff);

function apply() {
  renderer.toneMappingExposure = S.exposure * 1.05;
  finalPass.uniforms.uGlow.value = S.exposure;
  shoe.position.y = S.y;
  spin.rotation.y = S.rot;
  blob.rotation.z = S.rot;
  blob.material.opacity = 0.8 * THREE.MathUtils.clamp(1.4 - S.y * 2, 0, 1);

  const xr = S.xray;
  if ((xr > 0.001) !== xrayOn) setXray(xr > 0.001);
  for (const m of xrayFade) m.opacity = 1 - 0.9 * xr;
  mat.insole.opacity = 1 - 0.8 * xr;
  xrayMat.uniforms.uOpacity.value = xr;

  const c = S.chip;
  chip.visible = xr > 0.3;
  chipMat.core.color.copy(coreBase).multiplyScalar(0.15 + c * 14);
  chipMat.copper.emissiveIntensity = c * 0.35;
  chipLight.intensity = c * 1.6;
  halo.material.opacity = c * 0.9;

  camera.position.set(cam.px, cam.py, cam.pz);
  camera.lookAt(cam.tx, cam.ty, cam.tz);
  // debug: vaste aanzichten om de vorm te controleren (?view=side | top)
  if (VIEW === 'side') { spin.rotation.y = 0; camera.position.set(0, 0.6, 7); camera.lookAt(0, 0.6, 0); }
  if (VIEW === 'top') { spin.rotation.y = Math.PI / 2; camera.position.set(0, 8, 0.001); camera.lookAt(0, 0, 0); }
}

const params = new URLSearchParams(location.search);
if (params.has('t')) { tl.seek(parseFloat(params.get('t'))); if (!params.has('play')) tl.pause(); else tl.play(); }
else tl.play(0);

// debug-hook: rendertijd meten met ?perf
if (params.has('perf')) window.__perf = (n = 30, o = {}) => {
  const gl = renderer.getContext(), px = new Uint8Array(4);
  reflector.visible = !o.noRefl; bloom.enabled = !o.noBloom; renderer.shadowMap.enabled = !o.noShadow; shoe.visible = !o.noShoe;
  const t0 = performance.now();
  for (let i = 0; i < n; i++) { apply(); if (o.direct) renderer.render(scene, camera); else composer.render(); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
  reflector.visible = true; bloom.enabled = true; renderer.shadowMap.enabled = true; shoe.visible = true;
  return ((performance.now() - t0) / n).toFixed(2) + ' ms/frame';
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  apply();
  finalPass.uniforms.uTime.value = clock.getElapsedTime() % 10;
  composer.render();
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); tl.restart(); }
});
</script>
</body>
